<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 STAND · MASTER‑RESPO · ANKER</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#05070e;
            color:#c0d0d0;
            font-family:'Segoe UI','Consolas',monospace;
            min-height:100vh;
            display:flex;
            justify-content:center;
            padding:16px;
        }
        .container {
            max-width:1400px;
            width:100%;
            background:rgba(12,16,28,0.7);
            backdrop-filter:blur(4px);
            border-radius:28px;
            border:1px solid rgba(120,220,150,0.15);
            padding:24px 28px 32px;
            box-shadow:0 20px 60px rgba(0,0,0,0.8);
        }
        header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            border-bottom:1px solid rgba(120,220,150,0.08);
            padding-bottom:12px;
            margin-bottom:20px;
        }
        header h1 {
            font-size:24px;
            font-weight:300;
            letter-spacing:3px;
            background:linear-gradient(135deg,#7ee0a0,#d8f0c0,#b388ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        header .badge {
            background:rgba(120,220,150,0.08);
            border:1px solid rgba(120,220,150,0.15);
            border-radius:100px;
            padding:4px 18px;
            font-size:11px;
            color:#a0d0a8;
        }

        .grid-2 {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
        }
        @media (max-width:900px){ .grid-2 { grid-template-columns:1fr; } }

        .panel {
            background:rgba(16,20,14,0.4);
            border:1px solid rgba(120,220,150,0.08);
            border-radius:16px;
            padding:14px 18px;
        }
        .panel h2 {
            font-size:13px;
            color:#b0e8c0;
            border-bottom:1px solid rgba(120,220,150,0.1);
            padding-bottom:6px;
            margin-bottom:10px;
            letter-spacing:1px;
        }

        .stand-display {
            font-size:48px;
            text-align:center;
            color:#6bffa9;
            text-shadow:0 0 30px rgba(107,255,169,0.3);
            padding:12px 0;
            font-weight:700;
            letter-spacing:2px;
        }
        .stand-display small {
            font-size:14px;
            color:#5a7a6a;
            display:block;
            font-weight:300;
        }

        .respo-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
            gap:8px;
        }
        .respo-card {
            background:rgba(0,0,0,0.3);
            border:1px solid rgba(120,220,150,0.06);
            border-radius:10px;
            padding:10px 8px;
            text-align:center;
            cursor:pointer;
            transition:0.2s;
        }
        .respo-card:hover { border-color:rgba(120,220,150,0.2); }
        .respo-card .icon { font-size:22px; display:block; }
        .respo-card .name { font-size:11px; color:#d0e0e8; }
        .respo-card .status { font-size:9px; color:#5a7a6a; }
        .respo-card.active { border-color:#f0d080; background:rgba(240,208,128,0.05); }
        .respo-card .coord { font-size:8px; color:#b388ff; }

        .stand-matrix {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:6px;
        }
        .stand-matrix .item {
            background:rgba(0,0,0,0.2);
            border-radius:8px;
            padding:6px;
            text-align:center;
            font-size:10px;
            color:#5a7a6a;
            border:1px solid rgba(120,220,150,0.04);
        }
        .stand-matrix .item .val { display:block; font-size:18px; font-weight:bold; color:#8cf0d0; }

        .log-box {
            background:rgba(0,0,0,0.3);
            border-radius:10px;
            padding:8px 14px;
            font-size:10px;
            color:#5a7a6a;
            max-height:100px;
            overflow-y:auto;
            border:1px solid rgba(120,220,150,0.04);
            line-height:1.5;
            margin-top:12px;
        }
        .log-box .time { color:#2a3a3a; }
        .log-box .msg { color:#8aa8a0; }

        .footer {
            text-align:center;
            color:#3a4a5a;
            font-size:10px;
            margin-top:18px;
            border-top:1px solid rgba(120,220,150,0.04);
            padding-top:10px;
        }
        .gold { color:#f0d080; }
        .purple { color:#b388ff; }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>🌀 STAND · MASTER‑RESPO</h1>
        <span class="badge">● ANKER · KOORDINATOR</span>
    </header>

    <div class="panel" style="margin-bottom:16px;">
        <div class="stand-display" id="standValue">
            <span id="standMain">—</span>
            <small id="standSub">Stand der Dinge wird berechnet …</small>
        </div>
    </div>

    <div class="grid-2">

        <!-- Linke Seite: Respo‑Liste -->
        <div class="panel">
            <h2>🌀 RESPO‑CLUSTER <span style="font-size:10px;color:#5a7a6a;" id="respoCount">0</span></h2>
            <div class="respo-grid" id="respoGrid"></div>
            <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
                <button id="btnRefresh" style="background:rgba(20,28,20,0.4);border:1px solid rgba(120,220,150,0.12);border-radius:8px;padding:4px 16px;color:#c0d8c8;font-family:inherit;font-size:10px;cursor:pointer;">🔄 AKTUALISIEREN</button>
                <button id="btnReset" style="background:rgba(20,28,20,0.4);border:1px solid rgba(120,220,150,0.12);border-radius:8px;padding:4px 16px;color:#ff6b6b;font-family:inherit;font-size:10px;cursor:pointer;">⟲ RESET</button>
            </div>
        </div>

        <!-- Rechte Seite: Stand‑Matrix -->
        <div class="panel">
            <h2>📊 STAND‑MATRIX · 4‑Dimensional</h2>
            <div class="stand-matrix" id="standMatrix">
                <div class="item"><span class="val" id="mPos">0</span>Position</div>
                <div class="item"><span class="val" id="mKraft">0</span>Kraft</div>
                <div class="item"><span class="val" id="mZeit">0</span>Zeit</div>
                <div class="item"><span class="val" id="mRaum">0</span>Raum</div>
            </div>
            <div style="margin-top:10px;font-size:11px;color:#5a7a6a;">
                <span>⚡ SYNC: <span id="syncCount">0</span></span>
                <span style="margin-left:16px;">🔷 ANKER: <span id="ankerStatus">aktiv</span></span>
            </div>
        </div>

    </div>

    <!-- Log -->
    <div class="log-box" id="logBox">
        <div class="entry"><span class="time">[INIT]</span> <span class="msg">STAND · MASTER‑RESPO geladen</span></div>
    </div>

    <div class="footer">
        <span class="gold">✦</span> STAND der Dinge · Master‑Respo · Koordiniert alle Respos
        <span class="gold">✦</span>
    </div>

</div>

<script>
"use strict";

// ================================================================
//  STAND · MASTER‑RESPO · ANKER · KOORDINATOR
//  Der "Stand der Dinge" – der feste Punkt, der alle Respos misst.
// ================================================================

// ─── LOG ──────────────────────────────────────────────────────────
function log(msg) {
    const box = document.getElementById('logBox');
    const t = new Date().toLocaleTimeString('de-DE');
    const e = document.createElement('div');
    e.className = 'entry';
    e.innerHTML = `<span class="time">[${t}]</span> <span class="msg">${msg}</span>`;
    box.appendChild(e);
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 40) box.removeChild(box.firstChild);
}

// ─── RESPO‑DEFINITION (alle bekannten Respos) ──────────────────
// Jeder Respo hat: id, name, icon, status (aktiv/inaktiv), Koordinaten (x,y,z) im 3D‑Raum
const RESPOS = [
    { id: 'queast',  name: 'QUEAST',  icon: '🌀', status: 'aktiv', x:0, y:0, z:0 },
    { id: 'stage',   name: 'STAGE',   icon: '🎛️', status: 'aktiv', x:1, y:0, z:0 },
    { id: '4tel',    name: '4TEL',    icon: '⚡', status: 'aktiv', x:0, y:1, z:0 },
    { id: 'ecklos',  name: 'ECKLOS',  icon: '🔷', status: 'aktiv', x:1, y:1, z:0 },
    { id: 'cub',     name: 'CUB',     icon: '🧊', status: 'aktiv', x:0, y:0, z:1 },
    { id: 'olsen',   name: 'OLSEN',   icon: '🌿', status: 'inaktiv', x:1, y:0, z:1 },
    { id: 'bridge',  name: 'BRIDGE',  icon: '🌉', status: 'aktiv', x:0, y:1, z:1 },
    { id: 'holo',    name: 'HOLO',    icon: '🔺', status: 'aktiv', x:1, y:1, z:1 },
    { id: 'rawator', name: 'RAWATOR', icon: '⚙️', status: 'aktiv', x:0, y:2, z:0 },
    { id: 'respo',   name: 'RESPO',   icon: '🌀', status: 'aktiv', x:1, y:2, z:0 },
    { id: 'boerse',  name: 'BOERSE',  icon: '📈', status: 'aktiv', x:0, y:0, z:2 },
    { id: 'dom',     name: 'DOM',     icon: '🏛', status: 'aktiv', x:1, y:0, z:2 },
    { id: 'evo',     name: 'EVO',     icon: '🔮', status: 'aktiv', x:0, y:1, z:2 },
    { id: 'markt',   name: 'MARKT',   icon: '🏪', status: 'aktiv', x:1, y:1, z:2 },
    { id: 'tool48',  name: 'TOOL48',  icon: '🛠', status: 'aktiv', x:0, y:2, z:1 },
    { id: 'funktion',name: 'FUNKTION',icon: '⚙️', status: 'aktiv', x:1, y:2, z:1 }
];

// ─── STATE ──────────────────────────────────────────────────────
const state = {
    activeRespos: RESPOS.filter(r => r.status === 'aktiv'),
    stand: {
        position: 0,
        kraft: 0,
        zeit: 0,
        raum: 0
    },
    syncCount: 0,
    anker: true
};

// ─── RENDER RESPO‑GRID ──────────────────────────────────────────
function renderRespos() {
    const grid = document.getElementById('respoGrid');
    grid.innerHTML = '';
    state.activeRespos.forEach(r => {
        const card = document.createElement('div');
        card.className = 'respo-card active';
        card.innerHTML = `
            <span class="icon">${r.icon}</span>
            <span class="name">${r.name}</span>
            <span class="coord">(${r.x},${r.y},${r.z})</span>
            <span class="status">● ${r.status}</span>
        `;
        card.addEventListener('click', () => {
            // Klick zeigt Details im Log
            log(`🔍 Respo: ${r.name} · Koordinaten (${r.x},${r.y},${r.z}) · Status: ${r.status}`);
            // Kurz aktivieren
            card.style.borderColor = '#f0d080';
            setTimeout(() => card.style.borderColor = '', 300);
        });
        grid.appendChild(card);
    });
    document.getElementById('respoCount').textContent = state.activeRespos.length;
}

// ─── BEREECHNE STAND (aus allen aktiven Respos) ────────────────
function calculateStand() {
    const active = state.activeRespos;
    if (active.length === 0) {
        state.stand.position = 0;
        state.stand.kraft = 0;
        state.stand.zeit = 0;
        state.stand.raum = 0;
        return;
    }

    // Position: Durchschnitt aller Koordinaten (normalisiert 0..1)
    const avgX = active.reduce((s,r) => s + r.x, 0) / active.length;
    const avgY = active.reduce((s,r) => s + r.y, 0) / active.length;
    const avgZ = active.reduce((s,r) => s + r.z, 0) / active.length;
    const pos = (avgX + avgY + avgZ) / 3;
    state.stand.position = Math.round(pos * 100);

    // Kraft: Anzahl aktiver Respos / max (16)
    state.stand.kraft = Math.round((active.length / RESPOS.length) * 100);

    // Zeit: Tick-Zähler (simuliert)
    state.stand.zeit = (state.stand.zeit + 0.5) % 100;

    // Raum: Varianz der Koordinaten (wie verteilt sind die Respos)
    const xVals = active.map(r => r.x);
    const yVals = active.map(r => r.y);
    const zVals = active.map(r => r.z);
    const varX = xVals.reduce((s,v) => s + (v - avgX)**2, 0) / xVals.length;
    const varY = yVals.reduce((s,v) => s + (v - avgY)**2, 0) / yVals.length;
    const varZ = zVals.reduce((s,v) => s + (v - avgZ)**2, 0) / zVals.length;
    const raum = (varX + varY + varZ) / 3;
    state.stand.raum = Math.round(raum * 100);

    // SyncCount erhöhen (simuliert Aktivität)
    state.syncCount++;
}

// ─── UPDATE UI ──────────────────────────────────────────────────
function updateUI() {
    // Stand-Wert
    const mainValue = Math.round((state.stand.position + state.stand.kraft + state.stand.zeit + state.stand.raum) / 4);
    document.getElementById('standMain').textContent = mainValue + '%';
    document.getElementById('standSub').textContent =
        `${state.activeRespos.length} aktive Respos · Stand der Dinge`;

    // Stand-Matrix
    document.getElementById('mPos').textContent = state.stand.position;
    document.getElementById('mKraft').textContent = state.stand.kraft;
    document.getElementById('mZeit').textContent = Math.round(state.stand.zeit);
    document.getElementById('mRaum').textContent = state.stand.raum;

    // Sync
    document.getElementById('syncCount').textContent = state.syncCount;
    document.getElementById('ankerStatus').textContent = state.anker ? 'aktiv' : 'inaktiv';
}

// ─── MAIN LOOP ──────────────────────────────────────────────────
let tick = 0;
function loop() {
    tick++;
    if (tick % 3 === 0) { // alle 3 Ticks (ca. 50ms) neu berechnen
        calculateStand();
        updateUI();
        // Log nur selten
        if (tick % 30 === 0) {
            log(`📊 Stand: ${Math.round((state.stand.position+state.stand.kraft+state.stand.zeit+state.stand.raum)/4)}% · ${state.activeRespos.length} Respos`);
        }
    }
    requestAnimationFrame(loop);
}

// ─── BUTTONS ────────────────────────────────────────────────────
document.getElementById('btnRefresh').addEventListener('click', () => {
    calculateStand();
    updateUI();
    renderRespos();
    log('🔄 Aktualisiert');
});

document.getElementById('btnReset').addEventListener('click', () => {
    state.activeRespos = RESPOS.filter(r => r.status === 'aktiv');
    state.syncCount = 0;
    state.stand = { position: 0, kraft: 0, zeit: 0, raum: 0 };
    renderRespos();
    updateUI();
    log('⟲ RESET · Stand zurückgesetzt');
});

// ─── TASTATUR ──────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') document.getElementById('btnRefresh').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
});

// ─── INIT ──────────────────────────────────────────────────────
renderRespos();
calculateStand();
updateUI();
log('🧠 STAND · MASTER‑RESPO initialisiert');
log(`📦 ${state.activeRespos.length} Respos erkannt`);
log('⌨️  r=Refresh  x=Reset');

// ─── SYNCHRONISATION mit anderen Tabs (BroadcastChannel) ──────
try {
    const channel = new BroadcastChannel('stand-master');
    channel.onmessage = (e) => {
        if (e.data && e.data.type === 'stand.sync') {
            log(`📡 Sync von anderem Tab: ${e.data.value || 'ping'}`);
            state.syncCount++;
            updateUI();
        }
    };
    // Jede Minute ein Ping
    setInterval(() => {
        channel.postMessage({ type: 'stand.sync', value: state.stand.position });
    }, 60000);
    log('📡 BroadcastChannel aktiv');
} catch (_) {
    log('⚠️ BroadcastChannel nicht verfügbar');
}

// ─── SIMULATION: Respos ändern sich dynamisch (Lebendigkeit) ──
setInterval(() => {
    // Zufällig einen Respo toggeln (aktiv/inaktiv)
    const idx = Math.floor(Math.random() * RESPOS.length);
    const r = RESPOS[idx];
    if (r.status === 'aktiv') {
        r.status = 'inaktiv';
        log(`⏻ ${r.name} deaktiviert`);
    } else {
        r.status = 'aktiv';
        log(`⏻ ${r.name} aktiviert`);
    }
    state.activeRespos = RESPOS.filter(r => r.status === 'aktiv');
    renderRespos();
    calculateStand();
    updateUI();
}, 8000); // alle 8 Sekunden ein Wechsel

loop();

</script>
</body>
</html>
